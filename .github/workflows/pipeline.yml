name: NYC 311 ELT Pipeline

on:
  workflow_dispatch:
    inputs:
      dbt_target:
        description: dbt target profile
        type: choice
        options:
          - dev
          - prod
        default: dev
      dbt_select:
        description: Optional dbt node selection
        type: string
        required: false
        default: ""
      full_refresh:
        description: Rebuild incremental models with --full-refresh
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nyc311-elt-${{ inputs.dbt_target }}
  cancel-in-progress: false

env:
  IMAGE_NAME: nyc311-elt
  IMAGE_TAG: ${{ github.sha }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  BQ_LOCATION: ${{ vars.BQ_LOCATION || 'US' }}
  DBT_TARGET: ${{ inputs.dbt_target }}

jobs:
  elt:
    name: Ingest and transform
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Allow containers to read credentials
        run: chmod 644 "${{ steps.gcp_auth.outputs.credentials_file_path }}"

      - name: Build pipeline image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare dbt directories
        run: mkdir -p dbt/target dbt/dbt_packages

      - name: Resolve dbt flags
        env:
          DBT_SELECT: ${{ inputs.dbt_select }}
          FULL_REFRESH: ${{ inputs.full_refresh }}
        run: |
          FLAGS=""
          if [ -n "$DBT_SELECT" ]; then FLAGS="$FLAGS --select $DBT_SELECT"; fi
          if [ "$FULL_REFRESH" = "true" ]; then FLAGS="$FLAGS --full-refresh"; fi
          echo "DBT_FLAGS=$FLAGS" >> "$GITHUB_ENV"

      - name: Run ingestion container (NYC 311 to BigQuery raw)
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: |
          docker run --rm \
            -v "${{ steps.gcp_auth.outputs.credentials_file_path }}:/secrets/gcp.json:ro" \
            -e GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp.json \
            -e GCP_PROJECT_ID -e BQ_LOCATION -e SOCRATA_APP_TOKEN \
            "$IMAGE_NAME:$IMAGE_TAG" \
            python extract_load.py

      - name: Install dbt packages
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/dbt/dbt_packages:/app/dbt/dbt_packages" \
            "$IMAGE_NAME:$IMAGE_TAG" \
            dbt deps --project-dir /app/dbt --profiles-dir /app/dbt

      - name: Verify BigQuery connection
        run: |
          docker run --rm \
            -v "${{ steps.gcp_auth.outputs.credentials_file_path }}:/secrets/gcp.json:ro" \
            -v "$GITHUB_WORKSPACE/dbt/dbt_packages:/app/dbt/dbt_packages" \
            -e GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp.json \
            -e GCP_PROJECT_ID -e BQ_LOCATION \
            "$IMAGE_NAME:$IMAGE_TAG" \
            dbt debug --project-dir /app/dbt --profiles-dir /app/dbt --target "$DBT_TARGET"

      - name: Run dbt models
        run: |
          docker run --rm \
            -v "${{ steps.gcp_auth.outputs.credentials_file_path }}:/secrets/gcp.json:ro" \
            -v "$GITHUB_WORKSPACE/dbt/target:/app/dbt/target" \
            -v "$GITHUB_WORKSPACE/dbt/dbt_packages:/app/dbt/dbt_packages" \
            -e GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp.json \
            -e GCP_PROJECT_ID -e BQ_LOCATION \
            "$IMAGE_NAME:$IMAGE_TAG" \
            dbt run --project-dir /app/dbt --profiles-dir /app/dbt --target "$DBT_TARGET" $DBT_FLAGS

      - name: Publish run summary
        if: always() && hashFiles('dbt/target/run_results.json') != ''
        run: |
          {
            echo "### dbt run results (${DBT_TARGET})"
            echo
            echo "| Status | Count |"
            echo "|---|---|"
            jq -r '.results | group_by(.status) | map("| \(.[0].status) | \(length) |") | .[]' dbt/target/run_results.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target-${{ github.run_id }}
          path: |
            dbt/target/run_results.json
            dbt/target/manifest.json
          if-no-files-found: warn
          retention-days: 14
